name: Rust

on: [push, pull_request]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  msrv:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - name: Install MSRV
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Test MSRV
        run: cargo test --workspace --all-features --locked

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps

      - name: Test
        run: cargo test --workspace --all-features

      - name: Check big-endian target
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-powerpc64-linux-gnu
          rustup target add powerpc64-unknown-linux-gnu
          CC_powerpc64_unknown_linux_gnu=powerpc64-linux-gnu-gcc \
            cargo check -p retrovert-host --target powerpc64-unknown-linux-gnu

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --check

      - name: Build
        run: cargo build --workspace --all-features

      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

  miri:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Miri toolchain
        uses: dtolnay/rust-toolchain@nightly-2025-07-01
        with:
          components: miri, rust-src

      - name: Run targeted unsafe-code tests
        # The filter selects pure-Rust wire, buffer-view, and thread-transfer fixtures.
        # Dynamic-plugin and compiled-C fixtures are excluded because Miri cannot execute
        # native libraries or foreign code.
        run: cargo +nightly-2025-07-01 miri test -p retrovert-host --lib miri_unsafe
